<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demon List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: a list site. Navy page, a patterned banner, white level cards (thumbnail + "#N – Name" + credits + note) in a main column, a sticky sidebar with stats and the add form. Main / Extended / Legacy dividers like a real demon list. */
:root{
  --page:#1d2433; --banner:#141a26; --card:#ffffff; --card2:#f2f4f8; --ink:#1b2130; --muted:#69728a; --line:#dde2ec;
  --accent:#e8423c; --accent2:#ff9b2e; --blue:#3f7cf2; --gold:#f2b632;
  --head:"Montserrat","Arial Black",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px}
.banner{background:
  linear-gradient(135deg,rgba(232,66,60,.85),rgba(255,155,46,.75)),
  repeating-linear-gradient(45deg,#0000 0 22px,rgba(255,255,255,.07) 22px 44px),var(--banner);
  padding-block:34px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:4px solid #0d121c}
.banner .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px}
.spike{width:56px;height:56px;flex:none;background:#141a26;clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.spike::after{content:"";position:absolute;inset:14px 14px 4px;background:var(--gold);clip-path:polygon(50% 0,100% 100%,0 100%)}
.banner h1{font-family:var(--head);font-weight:900;font-size:clamp(28px,6vw,46px);color:#fff;margin:0;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.25);text-wrap:balance}
.banner p{margin:4px 0 0;color:#fff;opacity:.9;font-weight:600}
main{max-width:1100px;margin:0 auto;padding-block:26px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr} aside{order:-1}}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.divider{font-family:var(--head);font-weight:800;color:#fff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-top:6px}
.divider::after{content:"";flex:1;height:2px;background:rgba(255,255,255,.15)}
.divider small{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:600;opacity:.6}
li.demon{background:var(--card);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}
.thumb{position:relative;min-height:112px;display:flex;align-items:flex-end;padding:10px;color:#fff;overflow:hidden}
.thumb .pos{font-family:var(--head);font-weight:900;font-size:40px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);position:relative}
.thumb .tri{position:absolute;right:-18px;top:-10px;width:110px;height:110px;background:rgba(255,255,255,.14);clip-path:polygon(50% 0,100% 100%,0 100%)}
.thumb .sq{position:absolute;right:56px;bottom:-14px;width:46px;height:46px;border:4px solid rgba(255,255,255,.22)}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-family:var(--head);font-weight:800;font-size:20px;margin:0;color:var(--ink);overflow-wrap:anywhere}
.title .p{color:var(--accent)}
.credits{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.credits b{color:var(--ink);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:12px;font-weight:700;border-radius:3px;padding:3px 8px;background:var(--card2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.pts{background:#fff4dc;color:#8a5a00}
.chip.vid{background:#e9f0ff;color:#1f55c7;text-decoration:none}
.note{font-size:14px;color:#3a4256;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card2);border-radius:4px;padding:8px 10px}
.note.empty{color:var(--muted);font-style:italic}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
button,.btn{font:inherit;font-weight:700;font-size:13px;cursor:pointer;border-radius:4px;border:0;background:var(--card2);color:var(--ink);padding:6px 11px}
button:hover{filter:brightness(.95)}
button.go{background:var(--accent);color:#fff;font-size:15px;padding:10px 14px;box-shadow:0 3px 0 #9c231f}
button.danger{background:#fde7e6;color:#b42019}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){aside{position:static}}
.panel{background:var(--card);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);overflow:hidden}
.panel h2{margin:0;font-family:var(--head);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:var(--banner);color:#fff;padding:10px 14px}
.panel .in{padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:4px;padding:10px}
.stat b{display:block;font-family:var(--head);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
input,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line);padding-top:10px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.empty-state{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.18);border-radius:6px;padding:40px 18px;text-align:center;color:#c4cbdb}
.empty-state b{display:block;font-family:var(--head);font-weight:800;color:#fff;font-size:20px;margin-bottom:6px}
@media (max-width:560px){li.demon{grid-template-columns:1fr} .thumb{min-height:84px} .two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){li.demon{transition:transform .15s} li.demon:hover{transform:translateY(-2px)}}
</style>
</head>
<body>


<header class="banner"><div class="in">
  <div class="spike" aria-hidden="true"></div>
  <div><h1>MY DEMON LIST</h1><p>Hardest first. Every demon I've beaten, ranked.</p></div>
</div></header>

<main>
  <section>
    <ol class="list" id="list"></ol>
  </section>
  <aside>
    <div class="panel"><h2>Stats</h2><div class="in"><div class="stats">
      <div class="stat"><b id="sCount">0</b><span>Demons</span></div>
      <div class="stat"><b id="sPts">0</b><span>List points</span></div>
    </div><div class="status" id="sHard">Hardest: none yet</div></div></div>
    <div class="panel"><h2>Add a demon</h2>
      <form class="in" id="addForm" autocomplete="off">
        <label>Level name<input id="fName" required maxlength="80" placeholder="Level name"></label>
        <div class="two">
          <label>Creator<input id="fBy" maxlength="80" placeholder="Publisher"></label>
          <label>Verifier<input id="fVer" maxlength="80" placeholder="Verifier"></label>
        </div>
        <div class="two">
          <label>Position<input id="fPos" type="number" min="1" placeholder="1"></label>
          <label>Video link<input id="fVid" maxlength="300" placeholder="https://..."></label>
        </div>
        <label>Note<textarea id="fNote" maxlength="600" placeholder="Attempts, enjoyment, the worst part..."></textarea></label>
        <div class="row"><button class="go" type="submit" id="addBtn">Add to list</button><span class="status" id="status"></span></div>
      </form>
    </div>
  </aside>
</main>

<script type="application/json" id="state">{"levels":[]}</script>
<script>
(function(){
    let state; try { state = JSON.parse(document.getElementById('state').textContent); } catch(e) { state = {levels:[]}; }
  if (!Array.isArray(state.levels)) state.levels = [];
  let editing = -1, confirmDel = -1, saving = false;
  const $ = id => document.getElementById(id);
  const status = $('status');
  const MAIN = 75, EXT = 150;
  const pts = pos => pos > EXT ? 0 : Math.round(250 * Math.pow(0.9625, pos - 1) * 100) / 100;
  const HUES = [[232,66,60],[63,124,242],[146,72,214],[24,170,120],[242,150,30],[220,50,140],[40,150,200]];
  function hue(name){ let h=0; for (const c of name) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length]; }
  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  const goodUrl = u => /^https:\/\//i.test(u||'');

  function divider(label, range){ const d=el('li','divider',label); d.append(el('small',null,range)); return d; }

  function render(){
    const list=$('list'); list.textContent='';
    const L=state.levels;
    $('sCount').textContent=L.length;
    $('sPts').textContent=L.reduce((s,_,i)=>s+pts(i+1),0).toFixed(2);
    $('sHard').textContent=L.length?'Hardest: '+L[0].name:'Hardest: none yet';
    if(!L.length){
      const e=el('li','empty-state'); e.append(el('b',null,'The list is empty'));
      e.append(document.createTextNode('Add your first demon from the panel. Position 1 is the hardest.'));
      list.append(e); return;
    }
    L.forEach((lv,i)=>{
      const pos=i+1;
      if(pos===1) list.append(divider('Main list','#1 – #'+MAIN));
      if(pos===MAIN+1) list.append(divider('Extended list','#'+(MAIN+1)+' – #'+EXT));
      if(pos===EXT+1) list.append(divider('Legacy list','#'+(EXT+1)+' and below'));
      const li=el('li','demon');
      const [r,g,b]=hue(lv.name);
      const th=el('div','thumb');
      th.style.background=`linear-gradient(135deg,rgb(${r},${g},${b}),rgb(${Math.round(r*.45)},${Math.round(g*.45)},${Math.round(b*.45)}))`;
      th.append(el('div','tri'),el('div','sq'),el('div','pos','#'+pos));
      li.append(th);
      const bd=el('div','body');
      const t=el('h3','title'); const p=el('span','p','#'+pos+' – '); t.append(p,document.createTextNode(lv.name)); bd.append(t);
      if(lv.by||lv.ver){ const c=el('div','credits');
        if(lv.by){ c.append('published by '); c.append(el('b',null,lv.by)); }
        if(lv.by&&lv.ver) c.append(', ');
        if(lv.ver){ c.append('verified by '); c.append(el('b',null,lv.ver)); }
        bd.append(c); }
      const m=el('div','meta');
      m.append(el('span','chip pts',pts(pos).toFixed(2)+' pts'));
      m.append(el('span','chip',pos<=MAIN?'Main':pos<=EXT?'Extended':'Legacy'));
      if(goodUrl(lv.vid)){ const a=el('a','chip vid','▶ Video'); a.href=lv.vid; a.target='_blank'; a.rel='noopener'; m.append(a); }
      bd.append(m);
      bd.append(el('div','note'+(lv.note?'':' empty'),lv.note||'No note yet'));
      const acts=el('div','acts');
      const btn=(tx,fn,dis,cls)=>{ const x=el('button',cls||null,tx); x.type='button'; x.disabled=!!dis; x.onclick=fn; acts.append(x); };
      btn('▲ Up',()=>move(i,-1),i===0);
      btn('▼ Down',()=>move(i,1),i===L.length-1);
      btn('Edit',()=>{editing=i;confirmDel=-1;render();});
      if(confirmDel===i){ btn('Really delete?',()=>remove(i),false,'danger'); btn('Keep',()=>{confirmDel=-1;render();}); }
      else btn('Delete',()=>{confirmDel=i;editing=-1;render();},false,'danger');
      bd.append(acts);
      if(editing===i){
        const f=el('form','edit');
        const mk=(tag,id,val,ph,max)=>{ const x=el(tag); x.id=id; x.value=val||''; x.placeholder=ph; x.maxLength=max; return x; };
        const n=mk('input','eName',lv.name,'Level name',80); n.required=true;
        const by=mk('input','eBy',lv.by,'Publisher',80), ver=mk('input','eVer',lv.ver,'Verifier',80);
        const pp=el('input'); pp.id='ePos'; pp.type='number'; pp.min='1'; pp.value=pos; pp.placeholder='Position';
        const vid=mk('input','eVid',lv.vid,'Video link',300), no=mk('textarea','eNote',lv.note,'Note',600);
        const two1=el('div','two'); two1.append(by,ver); const two2=el('div','two'); two2.append(pp,vid);
        const row=el('div','row'); const s=el('button','go','Save'); s.type='submit'; const c=el('button',null,'Cancel'); c.type='button'; c.onclick=()=>{editing=-1;render();};
        row.append(s,c); f.append(n,two1,two2,no,row);
        f.onsubmit=e=>{ e.preventDefault(); if(!n.value.trim()) return;
          const item={name:n.value.trim(),by:by.value.trim(),ver:ver.value.trim(),vid:vid.value.trim(),note:no.value.trim()};
          L.splice(i,1); L.splice(clampPos(pp.value,L.length+1)-1,0,item); editing=-1; save(); };
        bd.append(f);
      }
      li.append(bd); list.append(li);
    });
  }
  function clampPos(v,max){ const n=parseInt(v,10); return isNaN(n)?1:Math.min(Math.max(n,1),max); }
  function move(i,d){ const L=state.levels,j=i+d; if(j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; save(); }
  function remove(i){ state.levels.splice(i,1); confirmDel=-1; save(); }

  const KEY='my-demon-list.v1';
  try{ const saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved&&Array.isArray(saved.levels)) state=saved; }catch(e){}
  function save(){
    render();
    try{ localStorage.setItem(KEY,JSON.stringify(state)); status.textContent='Saved.'; }
    catch(e){ status.textContent='Could not save in this browser.'; }
  }
  $('addForm').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('fName').value.trim(); if(!name) return;
    const item={name,by:$('fBy').value.trim(),ver:$('fVer').value.trim(),vid:$('fVid').value.trim(),note:$('fNote').value.trim()};
    state.levels.splice(clampPos($('fPos').value||1,state.levels.length+1)-1,0,item);
    ['fName','fBy','fVer','fPos','fVid','fNote'].forEach(id=>$(id).value='');
    save();
  });

  render();
})();
</script>

</body>
</html>
