<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dihmon List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* A list site: light page between two walls of blue blocks, white dashed-edge panels, a main column and a sidebar. */
:root{
  --page:#f3f4f6; --panel:#ffffff; --ink:#24262b; --muted:#6b7080; --line:#d4d7de; --soft:#eef0f4;
  --blue:#1d6fb8; --blue2:#2f8fe0; --link:#0b4fae; --up:#1d9a4f; --down:#d0362f; --gold:#e3a51b;
  --font:"Montserrat",system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px}
a{color:var(--link)}
.walls{position:fixed;inset:0;pointer-events:none;z-index:0}
.walls canvas{position:absolute;top:0;height:100%}
.walls .l{left:0}.walls .r{right:0}
.site{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:0 16px 60px}
@media (min-width:1500px){.site{max-width:1280px}}
nav.top{background:var(--panel);border:1px dashed var(--line);border-top:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.brand{font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--ink);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:inline-block;transform:rotate(45deg);border-radius:3px}
nav.top a.nl{color:var(--ink);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:4px}
nav.top a.nl:hover,nav.top a.nl.on{background:var(--soft)}
.tabs{background:var(--panel);border:1px dashed var(--line);display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.tabs a{text-align:center;padding:13px 6px;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{border-bottom-color:var(--blue2)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px dashed var(--line);padding:22px;box-shadow:0 2px 6px rgba(0,0,0,.05);min-width:0}
.panel+.panel{margin-top:24px}
.panel h2{font-size:26px;font-weight:700;text-align:center;margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.panel p{color:var(--muted);text-align:center;margin:.4em 0;line-height:1.45}
.list{display:flex;flex-direction:column;gap:16px}
.card{display:flex;gap:22px;align-items:center;background:var(--panel);border:1px dashed var(--line);padding:22px 28px;text-decoration:none;color:inherit;box-shadow:0 2px 6px rgba(0,0,0,.05);min-width:0}
.card:hover{border-color:var(--blue2)}
.thumb{flex:none;width:310px;max-width:42%;aspect-ratio:16/9;background:#1b2330 center/cover no-repeat;position:relative;overflow:hidden}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;text-align:center;padding:10px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.card .t{min-width:0}
.card h3{margin:0 0 4px;font-size:32px;font-weight:700;overflow-wrap:anywhere}
.card .pub{font-weight:700;font-size:21px;color:#4a4d55}
.card .pub b{color:var(--ink);border-bottom:1px dotted var(--ink)}
.card .pts{color:#555a66;margin-top:6px;font-size:16px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.card{flex-direction:column;align-items:stretch;padding:16px}.thumb{width:100%;max-width:100%}.card h3{font-size:24px}.card .pub{font-size:17px}}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
/* level page */
.lvhead{text-align:center}
.lvhead .nav{display:flex;align-items:center;justify-content:center;gap:24px}
.lvhead h1{font-size:44px;font-weight:700;margin:6px 0;overflow-wrap:anywhere}
.arrow{font-size:34px;font-weight:700;text-decoration:none;color:var(--ink);padding:0 6px}
.arrow.off{visibility:hidden}
.credits{font-weight:600;font-size:18px;color:#4a4d55;border-bottom:1px solid var(--line);padding-bottom:6px}
.credits b{color:var(--ink);border-bottom:1px dotted var(--ink)}
.quote{color:#444;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.video{margin:18px auto;max-width:740px;aspect-ratio:16/9;background:#111}
.video iframe{width:100%;height:100%;border:0;display:block}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 34px;margin:18px 0;text-align:center}
.stats div{min-width:110px}
.stats b{display:block;font-weight:700;font-size:17px}
.stats span{color:#555a66;font-size:17px;overflow-wrap:anywhere}
h4.sec{font-size:22px;font-weight:700;text-align:center;margin:28px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}
.small{font-size:13px;color:var(--muted)}
/* forms */
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .w{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:#4a4d55;min-width:0}
input,textarea,select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue2);outline-offset:1px}
@media (max-width:640px){form.f{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:4px;padding:10px 16px;background:var(--soft);color:var(--ink)}
button.go{background:var(--blue);color:#fff}
button.bad{background:#fbe5e3;color:#a3231c}
button.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-weight:600;font-size:14px}.msg.ok{color:var(--up)}.msg.err{color:var(--down)}
.sub{border:1px dashed var(--line);padding:14px;margin-bottom:12px}
.sub h5{margin:0 0 6px;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:3px;padding:2px 7px;background:var(--soft)}
.pill.rec{background:#e3effc;color:#0b4fae}.pill.lev{background:#fdf0d7;color:#8a5a00}
.stack{display:flex;flex-direction:column;gap:10px}
.lvrow{border-bottom:1px solid var(--soft);padding:8px 0}
</style>
</head>
<body>
<div class="walls" aria-hidden="true"><canvas class="l" id="wl"></canvas><canvas class="r" id="wr"></canvas></div>
<div class="site">
  <nav class="top">
    <a class="brand" href="#/"><i></i>DIHMON LIST</a>
    <a class="nl" href="#/" data-nav="list">List</a>
    <a class="nl" href="#/players" data-nav="players">Players</a>
    <a class="nl" href="#/submit" data-nav="submit">Submit</a>
    <a class="nl" href="#/admin" data-nav="admin">Admin</a>
  </nav>
  <div id="view"></div>
</div>
<style>.note-gh{background:#fff7e0;border:1px solid #f0d58a;color:#6b4e00!important;padding:10px 12px;border-radius:4px;text-align:left!important}</style>
<script>
'use strict';
// ==================================================================================================
// SETTINGS: your GitHub username and the repo this site lives in. (The list is the data.json file in it.)
const REPO_OWNER = 'lightningstudiosx';
const REPO_NAME = 'dihmonlist';
const BRANCH = 'main';
// ==================================================================================================
const MAIN = 75, EXTENDED = 150;
const $view = document.getElementById('view');
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs||{}) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const fmt = n => (Math.round(n*100)/100).toFixed(2);
const ytId = u => { if(!u) return null; const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };
const thumbOf = lv => lv.thumbnail || (ytId(lv.video) ? 'https://i.ytimg.com/vi/' + ytId(lv.video) + '/hqdefault.jpg' : null);
const date = s => s ? new Date(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '';
const now = () => new Date().toISOString();
function section(pos, L){ return pos <= L.main ? 'main' : pos <= L.extended ? 'extended' : 'legacy'; }
function navOn(n){ document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === n)); }
function thumb(lv){
  const t = thumbOf(lv), el = h('div',{class:'thumb'});
  if (t) el.style.backgroundImage = 'url("' + encodeURI(t).replace(/"/g,'%22') + '")';
  else { el.style.background = 'linear-gradient(135deg,#1d6fb8,#13253f)'; el.append(h('div',{class:'ph'}, lv.name)); }
  return el;
}
function pointsLine(lv){
  return lv.minScore != null ? fmt(lv.minScore) + ' (' + lv.minPercent + '%) — ' + fmt(lv.score) + ' (100%) points' : fmt(lv.score) + ' points';
}

// ------------------------------------------------------------------ the data (data.json in the repo)
function emptyData(){ return { levels: [], records: [], players: {}, nextId: 1 }; }
let DB = null;
async function loadData(fresh){
  if (DB && !fresh) return DB;
  try {
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    DB = r.ok ? Object.assign(emptyData(), await r.json()) : emptyData();
  } catch(e) { DB = emptyData(); }
  return DB;
}
const newId = () => String(DB.nextId++);

// scoring: #1 is worth 350, falling off; nothing past #150. A progress record (main list only) is worth a tenth
// of the full score at the list percent, rising to the full score at 100%.
function fullScore(pos){ return pos > EXTENDED ? 0 : Math.round(350 * Math.exp(-(pos - 1) * 0.0437) * 100) / 100; }
function recordScore(pos, min, pct){
  const full = fullScore(pos);
  if (pct >= 100) return full;
  if (pos > MAIN || !min || pct < min) return 0;
  return Math.round(full * Math.pow(10, (pct - min) / (100 - min)) / 10 * 100) / 100;
}
const sorted = () => DB.levels.slice().sort((a, b) => a.position - b.position);
function renumber(reason, mover){
  sorted().forEach((lv, i) => {
    const pos = i + 1; lv.history = lv.history || [];
    const was = lv.history.length ? lv.history[lv.history.length - 1].position : null;
    if (was !== pos) lv.history.push({ date: now(), position: pos, change: was == null ? null : was - pos, reason: lv === mover || !mover ? reason : mover.name + ': ' + reason.toLowerCase() });
    lv.position = pos;
  });
}
function placeLevel(lv, pos, reason){
  const L = sorted().filter(x => x !== lv);
  pos = Math.max(1, Math.min(pos || L.length + 1, L.length + 1));
  L.splice(pos - 1, 0, lv);
  if (!DB.levels.includes(lv)) DB.levels.push(lv);
  L.forEach((x, i) => { x.position = i + 1; });
  renumber(reason, lv);
}
const hidden = name => !!(DB.players[(name||'').toLowerCase()] || {}).banned;
function players(){
  const map = {};
  for (const r of DB.records){
    if (hidden(r.player)) continue;
    const lv = DB.levels.find(l => l.id === r.levelId); if (!lv) continue;
    const key = r.player.toLowerCase();
    const p = map[key] || (map[key] = { name: r.player, score: 0, completions: [], progress: [] });
    const s = recordScore(lv.position, lv.minPercent, r.percent);
    p.score += s;
    (r.percent >= 100 ? p.completions : p.progress).push({ levelId: lv.id, name: lv.name, position: lv.position, percent: r.percent, score: s });
  }
  return Object.values(map).map(p => (p.score = Math.round(p.score * 100) / 100, p)).sort((a, b) => b.score - a.score).map((p, i) => Object.assign(p, { rank: i + 1 }));
}
function publicLevel(lv, full){
  const out = Object.assign({}, lv, { score: fullScore(lv.position), minScore: lv.minPercent && lv.position <= MAIN ? recordScore(lv.position, lv.minPercent, lv.minPercent) : null });
  if (full) out.records = DB.records.filter(r => r.levelId === lv.id && !hidden(r.player)).sort((a, b) => b.percent - a.percent || (a.date||'').localeCompare(b.date||''));
  return out;
}
// the public pages ask for these
async function api(path){
  await loadData(false);
  if (path === '/api/list') return { levels: sorted().map(l => publicLevel(l, false)), main: MAIN, extended: EXTENDED };
  if (path === '/api/players') return players();
  const m = path.match(/^\/api\/levels\/(.+)$/);
  if (m) { const lv = DB.levels.find(l => l.id === decodeURIComponent(m[1])); if (!lv) throw new Error('That level isn\'t on the list.'); return publicLevel(lv, true); }
  throw new Error('Not found.');
}

// cleaning what people type
const str = (v, max = 120) => (typeof v === 'string' ? v.trim().slice(0, max) : v == null ? '' : String(v).trim().slice(0, max));
const num = (v, lo, hi) => { if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null; };
const url = v => { const s = str(v, 400); return /^https:\/\/[^\s<>"]+$/i.test(s) ? s : ''; };
function levelFields(b){
  return {
    name: str(b.name, 80), creators: str(b.creators, 200), publisher: str(b.publisher, 80), verifier: str(b.verifier, 80),
    video: url(b.video), thumbnail: url(b.thumbnail), quote: str(b.quote, 200), levelId: str(b.levelId, 20), password: str(b.password, 40),
    length: str(b.length, 20), objects: str(b.objects, 20), difficulty: str(b.difficulty, 40) || 'Extreme Demon', createdIn: str(b.createdIn, 20),
    song: str(b.song, 160), minPercent: num(b.minPercent, 1, 100),
  };
}

// ------------------------------------------------------------------ GitHub (the admin's token, kept in this browser only)
const GH = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME;
const token = () => { try { return localStorage.getItem('dl-token') || ''; } catch(e) { return ''; } };
async function gh(path, opts){
  opts = opts || {};
  const headers = { 'Accept': 'application/vnd.github+json' };
  if (token()) headers.Authorization = 'Bearer ' + token();
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(GH + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' });
  let data = null; try { data = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(r.status === 401 ? 'GitHub didn\'t accept that token.' : r.status === 404 ? 'GitHub can\'t find the repo (check REPO_OWNER / REPO_NAME at the top of index.html, and the token\'s access).' : (data && data.message) || ('GitHub error ' + r.status));
  return data;
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
let dataSha = null;
async function pullData(){                       // the admin works on the live file, not the site's cached copy
  try { const f = await gh('/contents/data.json?ref=' + BRANCH); dataSha = f.sha; DB = Object.assign(emptyData(), JSON.parse(unb64(f.content))); }
  catch(e) { if (/can't find/.test(e.message) && token()) { dataSha = null; DB = emptyData(); } else throw e; }
}
async function pushData(message){
  const body = { message: 'Dihmon List: ' + message, content: b64(JSON.stringify(DB, null, 1)), branch: BRANCH };
  if (dataSha) body.sha = dataSha;
  const r = await gh('/contents/data.json', { method: 'PUT', body });
  dataSha = r.content.sha;
}

// ------------------------------------------------------------------ pages
async function pageList(tab){
  navOn('list');
  const L = await api('/api/list');
  const tabs = h('div',{class:'tabs'},
    h('a',{href:'#/main', class: tab==='main'?'on':null},'Main List'),
    h('a',{href:'#/extended', class: tab==='extended'?'on':null},'Extended List'),
    h('a',{href:'#/legacy', class: tab==='legacy'?'on':null},'Legacy List'));
  const shown = L.levels.filter(lv => section(lv.position, L) === tab);
  const list = h('div',{class:'list'});
  if (!shown.length) list.append(h('div',{class:'panel empty'}, h('b',null, L.levels.length ? 'Nothing in this list yet' : 'The list is empty'),
    tab==='main' ? 'Once a level is approved it shows up here. Submit one from the Submit page.' : tab==='extended' ? 'Positions ' + (L.main+1) + ' to ' + L.extended + ' go here.' : 'Levels below #' + L.extended + ' go here.'));
  for (const lv of shown) list.append(h('a',{class:'card', href:'#/level/' + lv.id}, thumb(lv),
    h('div',{class:'t'}, h('h3',null,'#' + lv.position + ' – ' + lv.name),
      lv.publisher ? h('div',{class:'pub'},'published by ', h('b',null, lv.publisher)) : null,
      h('div',{class:'pts'}, pointsLine(lv)))));
  const hardest = L.levels[0];
  const side = h('aside',null,
    h('div',{class:'panel'}, h('h2',null,'Extreme Dihmons'),
      h('p',null,'The hardest extreme dihmons, ranked. Position 1 is the hardest.'),
      h('p',null, h('b',null, String(L.levels.length)), ' levels on the list'),
      hardest ? h('p',null,'Top: ', h('a',{href:'#/level/'+hardest.id}, hardest.name)) : null),
    h('div',{class:'panel'}, h('h2',null,'Submit'),
      h('p',null,'Beaten something on the list, or know an extreme dihmon that belongs here? Send it in. An admin checks every submission.'),
      h('p',null, h('a',{href:'#/submit'},'Submit a record or a level'))),
    h('div',{class:'panel'}, h('h2',null,'Guidelines'),
      h('p',null,'Records need a video of the whole run. Main list levels take progress records from their minimum percent; extended and legacy levels take 100% only.')));
  $view.replaceChildren(tabs, h('div',{class:'grid'}, list, side));
}

async function pageLevel(id){
  navOn('list');
  const [lv, L] = await Promise.all([api('/api/levels/' + encodeURIComponent(id)), api('/api/list')]);
  const i = L.levels.findIndex(x => x.id === lv.id), prev = L.levels[i-1], next = L.levels[i+1];
  const cred = h('div',{class:'credits'});
  const part = (lab, who) => { if (!who) return; if (cred.childNodes.length) cred.append(', '); cred.append(lab, h('b',null, who)); };
  part('by ', lv.creators); part('published by ', lv.publisher); part('verified by ', lv.verifier);
  const vid = ytId(lv.video);
  const stats = h('div',{class:'stats'});
  const stat = (k, v) => { if (v) stats.append(h('div',null, h('b',null,k), h('span',null,v))); };
  stat('Level Password', lv.password); stat('Level ID', lv.levelId); stat('Level Length', lv.length); stat('Object Count', lv.objects);
  stat('In-Game Difficulty', lv.difficulty); stat('Created In', lv.createdIn); stat('Song', lv.song);
  const scores = h('div',{class:'stats'}, h('div',null, h('b',null,'Dihmonlist score (100%)'), h('span',null, fmt(lv.score))),
    lv.minScore != null ? h('div',null, h('b',null,'Dihmonlist score (' + lv.minPercent + '%)'), h('span',null, fmt(lv.minScore))) : null);
  const hist = h('table',{class:'tbl'}, h('thead',null,h('tr',null, h('th',null,'Date'), h('th',null,'Change'), h('th',null,'New position'), h('th',null,'Reason'))),
    h('tbody',null, (lv.history||[]).slice().reverse().map(e => h('tr',null, h('td',null,date(e.date)),
      h('td',null, e.change == null ? '—' : e.change > 0 ? h('span',{class:'up'},'▲ ' + e.change) : e.change < 0 ? h('span',{class:'down'},'▼ ' + (-e.change)) : '0'),
      h('td',null,'#' + e.position), h('td',null, e.reason || '')))));
  const recs = lv.records.length ? h('table',{class:'tbl'}, h('thead',null,h('tr',null, h('th',null,'Player'), h('th',null,'Progress'), h('th',null,'Video'))),
    h('tbody',null, lv.records.map(r => h('tr',null, h('td',null,r.player), h('td',null, r.percent + '%'), h('td',null, h('a',{href:r.video, target:'_blank', rel:'noopener noreferrer'},'Watch'))))))
    : h('p',null,'No records yet. ', h('a',{href:'#/submit/' + lv.id},'Submit one'), '.');
  const main = h('div',{class:'panel'},
    h('div',{class:'lvhead'},
      h('div',{class:'nav'}, h('a',{class:'arrow' + (prev?'':' off'), href: prev ? '#/level/'+prev.id : '#', 'aria-label':'Previous level'},'‹'),
        h('h1',null, lv.name), h('a',{class:'arrow' + (next?'':' off'), href: next ? '#/level/'+next.id : '#', 'aria-label':'Next level'},'›')),
      h('div',{class:'small'}, '#' + lv.position + ' · ' + ({main:'Main List', extended:'Extended List', legacy:'Legacy List'})[section(lv.position, L)]),
      cred.childNodes.length ? cred : null,
      lv.quote ? h('div',{class:'quote'}, '“' + lv.quote + '”') : null),
    vid ? h('div',{class:'video'}, h('iframe',{src:'https://www.youtube-nocookie.com/embed/' + vid, title: lv.name + ' video', allow:'accelerometer; encrypted-media; gyroscope; picture-in-picture', allowfullscreen:true, loading:'lazy'}))
        : lv.video ? h('p',null, h('a',{href:lv.video, target:'_blank', rel:'noopener noreferrer'},'Watch the verification')) : null,

    h('div',{class:'scroll'}, recs));
  const side = h('aside',null, h('div',{class:'panel'}, h('h2',null,'Beaten it?'), h('p',null,'Send your run with a video and an admin will add it.'),

// ---- submitting: it opens a ready-made GitHub issue on the repo; the admin approves it from the admin page
async function pageSubmit(levelPre){
  navOn('submit');
  const L = await api('/api/list');
  let mode = 'record';
  const box = h('div');
  function draw(){
    const out = h('span',{class:'msg', role:'status'});
    let form;
    if (mode === 'record'){
      const sel = h('select',{name:'levelId', id:'rLevel', required:true}, h('option',{value:''},'Choose a level'),
        L.levels.map(lv => h('option',{value:lv.id, selected: lv.id===levelPre ? true : null}, '#' + lv.position + ' – ' + lv.name)));
      form = h('form',{class:'f', id:'recForm'},
        h('label',{class:'w'},'Level', sel),
        h('label',null,'Player name', h('input',{name:'player', id:'rPlayer', required:true, maxlength:40})),
        h('label',null,'Percent', h('input',{name:'percent', id:'rPct', type:'number', min:1, max:100, value:100, required:true})),
        h('label',{class:'w'},'Video link', h('input',{name:'video', id:'rVid', type:'url', placeholder:'https://youtube.com/...', required:true})),
        h('label',{class:'w'},'Notes for the admin (optional)', h('textarea',{name:'note', id:'rNote', maxlength:300})),
        h('div',{class:'w row'}, h('button',{class:'go', type:'submit'},'Submit record on GitHub'), out));
    } else {
      const f = (lab, name, attrs, w) => h('label',{class: w?'w':null}, lab, h(attrs && attrs.ta ? 'textarea' : 'input', Object.assign({name, id:'l_'+name}, attrs||{}, {ta:null})));
      form = h('form',{class:'f', id:'lvForm'},
        f('Level name', 'name', {required:true, maxlength:80}), f('Suggested position', 'suggested', {type:'number', min:1}),
        f('Creators', 'creators', {maxlength:200}), f('Publisher', 'publisher', {maxlength:80}),
        f('Verifier', 'verifier', {maxlength:80}), f('Verification video', 'video', {type:'url', required:true, placeholder:'https://youtube.com/...'}),
        f('Thumbnail image link (optional, the video\'s is used otherwise)', 'thumbnail', {type:'url', placeholder:'https://...'}, true),
        f('Level ID', 'levelId', {maxlength:20}), f('Level password', 'password', {maxlength:40}),
        f('Length', 'length', {maxlength:20, placeholder:'2m:45s'}), f('Object count', 'objects', {maxlength:20}),
        f('Created in', 'createdIn', {maxlength:20, placeholder:'2.2'}), f('List percent (minimum for records)', 'minPercent', {type:'number', min:1, max:100}),
        f('Song', 'song', {maxlength:160}, true), f('Quote', 'quote', {maxlength:200}, true),
        f('Notes for the admin (optional)', 'note', {ta:true, maxlength:300}, true),
        h('div',{class:'w row'}, h('button',{class:'go', type:'submit'},'Submit level on GitHub'), out));
    }
    form.addEventListener('submit', e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(form).entries());
      let title, payload;
      if (mode === 'record'){
        const lv = L.levels.find(x => x.id === d.levelId), pct = num(d.percent, 1, 100);
        if (!lv) { out.className='msg err'; out.textContent='Pick a level.'; return; }
        if (!url(d.video)) { out.className='msg err'; out.textContent='The video link has to start with https://.'; return; }
        if (pct < 100 && (lv.position > MAIN || !lv.minPercent || pct < lv.minPercent)) { out.className='msg err'; out.textContent = lv.position > MAIN ? 'Extended and legacy levels only take 100% records.' : 'That\'s below the list percent (' + (lv.minPercent||100) + '%).'; return; }
        payload = { type:'record', levelId: lv.id, level: lv.name, player: str(d.player, 40), percent: pct, video: url(d.video), note: str(d.note, 300) };
        title = '[Record] ' + payload.player + ' – ' + lv.name + ' ' + pct + '%';
      } else {
        if (!url(d.video)) { out.className='msg err'; out.textContent='The video link has to start with https://.'; return; }
        payload = Object.assign({ type:'level', suggested: num(d.suggested, 1, 10000), note: str(d.note, 300) }, levelFields(d));
        title = '[Level] ' + payload.name;
      }
      const body = 'Submitted from the Dihmon List site. Please don\'t edit the block below.\n\n```json\n' + JSON.stringify(payload, null, 1) + '\n```\n';
      const link = 'https://github.com/' + REPO_OWNER + '/' + REPO_NAME + '/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
      window.open(link, '_blank', 'noopener');
      out.className = 'msg ok'; out.textContent = 'GitHub opened in a new tab. Press "Submit new issue" there to send it.';
    });
    box.replaceChildren(h('div',{class:'row', style:'justify-content:center;margin-bottom:16px'},
      h('button',{class: mode==='record'?'go':null, type:'button', onclick:()=>{mode='record'; draw();}},'Submit a record'),
      h('button',{class: mode==='level'?'go':null, type:'button', onclick:()=>{mode='level'; draw();}},'Submit a level')),
      h('p',{class:'note-gh'}, 'Submissions go through GitHub, so you need a GitHub account to submit. ', h('a',{href:'https://github.com/signup', target:'_blank', rel:'noopener noreferrer'},'Get a free GitHub account'), ', then come back here.'),
      form);
  }
  draw();
  $view.replaceChildren(h('div',{class:'grid'}, h('div',{class:'panel'}, h('h2',null,'Submit'), box),
    h('aside',null, h('div',{class:'panel'}, h('h2',null,'Before you submit'),
      h('p',null,'Records need an uncut video of the run. Main list levels accept progress from their list percent; extended and legacy levels need 100%.'),
      h('p',null,'You need a GitHub account. Filling this in opens a GitHub issue with everything filled in: just press "Submit new issue". Nothing appears on the site until an admin approves it.')))));
}

// ---- admin
async function pageAdmin(){
  navOn('admin');
  if (token()) { try { await pullData(); return adminPanel(); } catch(e) { return adminLogin(e.message); } }
  adminLogin('');
}
function adminLogin(err){
  const out = h('span',{class:'msg err', role:'status'}, err || '');
  const pw = h('input',{type:'password', id:'ghToken', autocomplete:'off', required:true, placeholder:'github_pat_...'});
  const form = h('form',{class:'f'}, h('label',{class:'w'},'GitHub token', pw), h('div',{class:'w row'}, h('button',{class:'go', type:'submit'},'Log in'), out));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    try { localStorage.setItem('dl-token', pw.value.trim()); } catch(x) {}
    try { await gh(''); await pullData(); adminPanel(); }
    catch(x) { try { localStorage.removeItem('dl-token'); } catch(y) {} out.textContent = x.message; }
  });
  $view.replaceChildren(h('div',{class:'grid'}, h('div',{class:'panel'}, h('h2',null,'Admin'), form),
    h('aside',null, h('div',{class:'panel'}, h('h2',null,'Your token'),
      h('p',null,'Make one at GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Give it only this repo, with Contents: Read and write and Issues: Read and write.'),
      h('p',null,'It stays in this browser. Anyone with it can change the list, so don\'t share it.')))));
}
function parseIssue(it){
  const m = (it.body || '').match(/```json\s*([\s\S]*?)```/);
  if (!m) return null;
  try { const p = JSON.parse(m[1]); return (p.type === 'record' || p.type === 'level') ? p : null; } catch(e) { return null; }
}
async function adminPanel(){
  const status = h('span',{class:'msg', role:'status'});
  const say = (ok, t) => { status.className = 'msg ' + (ok?'ok':'err'); status.textContent = t; };
  let busy = false;
  // change the list, then commit data.json to the repo (fetching the latest first so nothing gets overwritten)
  async function commit(change, message, after){
    if (busy) return; busy = true; say(true, 'Saving to GitHub...');
    try { await pullData(); change(); await pushData(message); if (after) await after(); say(true, 'Saved. The site updates in about a minute.'); adminPanel(); }
    catch(e) { say(false, e.message); }
    busy = false;
  }
  let issues = [];
  try { issues = (await gh('/issues?state=open&per_page=100')).filter(i => !i.pull_request && /^\[(Record|Level)\]/.test(i.title)); }
  catch(e) { say(false, 'Couldn\'t load submissions: ' + e.message); }
  const L = sorted();

  // submissions
  const subBox = h('div');
  if (!issues.length) subBox.append(h('p',null,'No submissions waiting.'));
  for (const it of issues){
    const s = parseIssue(it);
    const close = (why) => gh('/issues/' + it.number, { method:'PATCH', body:{ state:'closed', state_reason: why === 'Approved' ? 'completed' : 'not_planned' } })
      .then(() => gh('/issues/' + it.number + '/comments', { method:'POST', body:{ body: why + ' on the Dihmon List.' } }));
    const kv = h('dl',{class:'kv'});
    const add = (k, v) => { if (v != null && v !== '') kv.append(h('dt',null,k), h('dd',null, /^https:/.test(String(v)) ? h('a',{href:v, target:'_blank', rel:'noopener noreferrer'}, String(v)) : String(v))); };
    add('From', it.user && it.user.login); add('Date', date(it.created_at));
    const pos = h('input',{type:'number', min:1, value: (s && s.suggested) || L.length + 1, style:'width:110px', 'aria-label':'Position'});
    let approve = null;
    if (!s) add('Problem', 'This issue has no submission data in it (someone wrote it by hand).');
    else if (s.type === 'record'){
      add('Level', s.level); add('Player', s.player); add('Percent', s.percent + '%'); add('Video', s.video); add('Note', s.note);
      approve = () => commit(() => {
        const lv = DB.levels.find(l => l.id === s.levelId); if (!lv) throw new Error('That level isn\'t on the list any more.');
        DB.records.push({ id: newId(), levelId: lv.id, player: str(s.player, 40), percent: num(s.percent, 1, 100) || 100, video: url(s.video), date: now() });
      }, 'record ' + s.player + ' on ' + s.level, () => close('Approved'));
    } else {
      ['name','creators','publisher','verifier','video','thumbnail','levelId','password','length','objects','createdIn','song','quote','minPercent','note'].forEach(k => add(k, s[k]));
      approve = () => commit(() => {
        const lv = Object.assign({ id: newId(), history: [] }, levelFields(s));
        if (!lv.name) throw new Error('The submission has no level name.');
        placeLevel(lv, num(pos.value, 1, 10000), 'Added to the list');
      }, 'added ' + s.name, () => close('Approved'));
    }
    subBox.append(h('div',{class:'sub'},
      h('h5',null, h('span',{class:'pill ' + (s && s.type==='record'?'rec':'lev')}, s ? s.type.toUpperCase() : '?'), ' ', h('a',{href:it.html_url, target:'_blank', rel:'noopener noreferrer'}, it.title)), kv,
      h('div',{class:'row'}, s && s.type==='level' ? h('label',null,'Position', pos) : null,
        approve ? h('button',{class:'go sm', onclick:approve},'Approve') : null,
        h('button',{class:'bad sm', onclick: async ()=>{ try { say(true,'Closing...'); await close('Rejected'); say(true,'Rejected.'); adminPanel(); } catch(e){ say(false, e.message); } }},'Reject'))));
  }

  // levels
  const fields = [['name','Name'],['position','Position','number'],['creators','Creators'],['publisher','Publisher'],['verifier','Verifier'],['video','Video link','url'],
    ['thumbnail','Thumbnail link','url'],['levelId','Level ID'],['password','Password'],['length','Length'],['objects','Object count'],['difficulty','In-game difficulty'],
    ['createdIn','Created in'],['song','Song'],['quote','Quote'],['minPercent','List percent','number'],['reason','Reason for a move (for position history)']];
  function levelForm(lv){
    const form = h('form',{class:'f'}, fields.map(([k,lab,type]) => h('label',{class: k==='song'||k==='quote'||k==='reason'?'w':null}, lab,
      h('input',{name:k, type:type||'text', value: lv ? (lv[k] != null ? lv[k] : '') : (k==='position' ? L.length+1 : k==='difficulty' ? 'Extreme Demon' : ''), required: k==='name'}))),
      h('div',{class:'w row'}, h('button',{class:'go', type:'submit'}, lv ? 'Save level' : 'Add level'),
        lv ? h('button',{class:'bad', type:'button', onclick:(e)=>{ const b = e.currentTarget; if (b.dataset.armed){
          commit(() => { DB.levels = DB.levels.filter(l => l.id !== lv.id); DB.records = DB.records.filter(r => r.levelId !== lv.id); renumber(lv.name + ' was removed'); }, 'removed ' + lv.name);
        } else { b.dataset.armed='1'; b.textContent='Click again to delete'; } }}, 'Delete') : null));
    form.addEventListener('submit', e => { e.preventDefault(); const d = Object.fromEntries(new FormData(form).entries());
      const f = levelFields(d); if (!f.name) { say(false,'Enter the level name.'); return; }
      if (lv) commit(() => { const x = DB.levels.find(l => l.id === lv.id); if (!x) throw new Error('That level is gone.'); Object.assign(x, f);
          const p = num(d.position, 1, 10000); if (p && p !== x.position) placeLevel(x, p, str(d.reason, 120) || (p < x.position ? 'Moved up' : 'Moved down')); }, 'edited ' + f.name);
      else commit(() => placeLevel(Object.assign({ id: newId(), history: [] }, f), num(d.position, 1, 10000), 'Added to the list'), 'added ' + f.name);
    });
    return form;
  }
  const levelsBox = h('div');
  for (const lv of L){
    const holder = h('div');
    levelsBox.append(h('div',{class:'lvrow'}, h('div',{class:'row'}, h('b',null,'#' + lv.position + ' – ' + lv.name),
      h('button',{class:'sm', onclick:()=>{ if (holder.childNodes.length) holder.replaceChildren(); else holder.replaceChildren(levelForm(lv)); }},'Edit')), holder));
  }

  // records, players
  const recBody = h('tbody', null, DB.records.map(r => h('tr',null, h('td',null, r.player), h('td',null, (DB.levels.find(l => l.id === r.levelId)||{}).name || '?'), h('td',null, r.percent+'%'),
    h('td',null, r.video ? h('a',{href:r.video, target:'_blank', rel:'noopener noreferrer'},'Video') : ''),
    h('td',null, h('button',{class:'bad sm', onclick:()=>commit(() => { DB.records = DB.records.filter(x => x.id !== r.id); }, 'removed a record by ' + r.player)},'Remove')))));
  const names = [...new Set(DB.records.map(r => r.player))];
  const plBody = h('tbody', null, names.map(n => { const b = hidden(n);
    return h('tr',null, h('td',null,n), h('td',null, b ? 'Hidden from the list' : 'Shown'),
      h('td',null, h('button',{class:'sm' + (b?'':' bad'), onclick:()=>commit(() => { DB.players[n.toLowerCase()] = { banned: !b }; }, (b?'showed ':'hid ') + n)}, b ? 'Show' : 'Hide'))); }));

  // export / import
  const file = h('input',{type:'file', accept:'application/json,.json', id:'importFile'});
  const io = h('div',{class:'stack'},
    h('div',{class:'row'}, h('button',{class:'go', onclick: ()=>{ const a = h('a',{href: URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'})), download:'dihmon-list-' + new Date().toISOString().slice(0,10) + '.json'}); document.body.append(a); a.click(); a.remove(); say(true,'Exported.'); }},'Export JSON')),
    h('label',null,'Import a JSON export (replaces the whole list)', file),
    h('div',{class:'row'}, h('button',{class:'bad', onclick: async ()=>{ const f = file.files[0]; if(!f){ say(false,'Choose a file first.'); return; }
      let data; try { data = JSON.parse(await f.text()); } catch(e){ say(false,'That file is not valid JSON.'); return; }
      if (!data || !Array.isArray(data.levels)) { say(false,'That file is not a Dihmon List export.'); return; }
      commit(() => { DB = Object.assign(emptyData(), data); DB.nextId = Math.max(DB.nextId || 1, 1, ...[...DB.levels, ...DB.records].map(x => (parseInt(x.id,10) || 0) + 1)); renumber('Imported'); }, 'imported a backup'); }},'Import and replace')));

  $view.replaceChildren(h('div',{class:'grid'},
    h('div',null,
      h('div',{class:'panel'}, h('h2',null,'Submissions (' + issues.length + ')'), subBox),
      h('div',{class:'panel'}, h('h2',null,'Levels'), levelsBox.childNodes.length ? levelsBox : h('p',null,'No levels yet.'), h('h4',{class:'sec'},'Add a level'), levelForm(null)),
      h('div',{class:'panel'}, h('h2',null,'Records'), DB.records.length ? h('div',{class:'scroll'}, h('table',{class:'tbl'}, h('thead',null,h('tr',null,h('th',null,'Player'),h('th',null,'Level'),h('th',null,'%'),h('th',null,''),h('th',null,''))), recBody)) : h('p',null,'No records yet.')),
      h('div',{class:'panel'}, h('h2',null,'Players'), h('p',null,'Hide a player to take them off the leaderboard without deleting their records.'), names.length ? h('div',{class:'scroll'}, h('table',{class:'tbl'}, plBody)) : h('p',null,'Nobody yet.'))),
    h('aside',null, h('div',{class:'panel'}, h('h2',null,'Status'), h('p',null, status), h('p',{class:'small'},'Every change is saved to data.json in your repo. The public site picks it up in about a minute.')),
      h('div',{class:'panel'}, h('h2',null,'Backup'), io),
      h('div',{class:'panel'}, h('h2',null,'Session'), h('p',null, h('button',{onclick:()=>{ try { localStorage.removeItem('dl-token'); } catch(e) {} DB = null; pageAdmin(); }},'Log out'))))));
}

// ------------------------------------------------------------------ router
async function route(){
  const parts = location.hash.replace(/^#\/?/,'').split('/');
  try {
    if (parts[0] !== 'admin') await loadData(false);
    if (parts[0] === 'level' && parts[1]) await pageLevel(parts[1]);
    else if (parts[0] === 'players') await pagePlayers();
    else if (parts[0] === 'submit') await pageSubmit(parts[1]);
    else if (parts[0] === 'admin') await pageAdmin();
    else await pageList(['main','extended','legacy'].includes(parts[0]) ? parts[0] : 'main');
  } catch(e) {
    $view.replaceChildren(h('div',{class:'panel empty', style:'margin-top:24px'}, h('b',null,'Something went wrong'), e.message));
  }
}
addEventListener('hashchange', route);
route();

// ------------------------------------------------------------------ the walls of blue blocks
function walls(){
  const W = Math.max(0, (innerWidth - 1300) / 2 + 10);
  for (const id of ['wl','wr']){
    const c = document.getElementById(id); c.style.display = W < 30 ? 'none' : 'block'; if (W < 30) continue;
    const dpr = devicePixelRatio || 1; c.width = W * dpr; c.height = innerHeight * dpr; c.style.width = W + 'px';
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    const cols = ['#0e5ea8','#1678c8','#2a90de','#46aef0','#0a4f8e','#3d8cc4'];
    let seed = id === 'wl' ? 7 : 13; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let y = -40; y < innerHeight + 40; y += 26){
      const reach = W * (0.45 + rnd() * 0.55);
      for (let k = 0; k < 4; k++){
        const s = 40 + rnd() * 50, x = rnd() * reach - s * 0.3;
        g.fillStyle = cols[Math.floor(rnd() * cols.length)];
        g.fillRect(id === 'wl' ? x : W - x - s, y + rnd() * 20, s, s);
      }
    }
  }
}
addEventListener('resize', walls); walls();
